<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FareDealFinder | Contact Inquiry</title>
  </head>
  <body style="margin:0;padding:0;background:#f5f3ed;font-family:Arial,Helvetica,sans-serif;color:#172c30">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#f5f3ed">
      <tr>
        <td align="center" style="padding:32px 12px">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:650px;background:#ffffff;border:1px solid #d9dfd9;border-radius:12px;overflow:hidden">
            <tr>
              <td style="padding:30px 24px;background:#101d1c;text-align:center">
                <p style="margin:0 0 8px;font-size:28px;font-weight:bold;color:#86d0c5">FareDealFinder</p>
                <p style="margin:0;font-size:14px;color:#eaf0ed">New Contact Inquiry</p>
              </td>
            </tr>
            <tr>
              <td style="padding:28px 24px">
                <h1 style="margin:0 0 22px;font-size:22px;color:#172c30">{{subject}}</h1>
                <table width="100%" cellpadding="0" cellspacing="0" border="0" style="font-size:14px;line-height:1.6;table-layout:fixed">
                  <tr>
                    <th scope="row" align="left" valign="top" width="80" style="padding:10px 12px 10px 0;color:#66777a;border-bottom:1px solid #d9dfd9">Name</th>
                    <td style="padding:10px 0;border-bottom:1px solid #d9dfd9;overflow-wrap:anywhere;word-break:break-word">{{name}}</td>
                  </tr>
                  <tr>
                    <th scope="row" align="left" valign="top" width="80" style="padding:10px 12px 10px 0;color:#66777a;border-bottom:1px solid #d9dfd9">Email</th>
                    <td style="padding:10px 0;border-bottom:1px solid #d9dfd9;overflow-wrap:anywhere;word-break:break-word">{{email}}</td>
                  </tr>
                  <tr>
                    <th scope="row" align="left" valign="top" width="80" style="padding:10px 12px 10px 0;color:#66777a">Phone</th>
                    <td style="padding:10px 0;overflow-wrap:anywhere;word-break:break-word">{{phone}}</td>
                  </tr>
                </table>
                <h2 style="margin:28px 0 12px;font-size:18px">Message</h2>
                <div style="padding:18px;background:#eaf0e7;border-left:3px solid #177c79;font-size:14px;line-height:1.8;overflow-wrap:anywhere;word-break:break-word">{{#each messageLines}}{{this}}{{#unless @last}}<br />{{/unless}}{{/each}}</div>
                <p style="margin:24px 0 0;font-size:13px;line-height:1.7;color:#66777a">Use Reply to respond directly to the sender.</p>
              </td>
            </tr>
            <tr>
              <td style="padding:18px 24px;border-top:1px solid #d9dfd9;text-align:center;font-size:12px;line-height:1.6;color:#66777a">Submitted through the FareDealFinder contact form.</td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
